name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 9:00 AM UTC
    - cron: '0 9 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a Supabase (Tabla Products)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -X GET "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
          -H "apikey: ${SUPABASE_ANON_KEY}" \
          -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
